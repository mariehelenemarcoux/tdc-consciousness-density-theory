[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdc-research-v1-10-rc1"
version = "1.10.0rc1"
description = "TDC non-compensable multi-certificate safety research layer"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]
